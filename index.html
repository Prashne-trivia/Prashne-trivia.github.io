<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prashne • Daily 7 Trivia</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <!-- Theme + styles -->
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="min-h-screen bg-editorial-grid-light dark:bg-editorial-grid-dark text-ink-900 dark:text-paper-50 transition-colors duration-200 selection:bg-saffron selection:text-white flex flex-col">
  <!-- Mount points: filled by components in js/components/ -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-sm px-4"></div>
  <div id="app-header"></div>
  <main id="app-main" class="flex-1 w-full max-w-xl mx-auto px-4 py-4 flex flex-col justify-center"></main>
  <div id="app-footer-slot"></div>
  <div id="app-modal-slot"></div>

  <!-- Plain scripts (no modules) so this also works when opened as a local file. Order matters. -->
  <script src="js/core/config.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/sound.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/home.js"></script>
  <script src="js/components/game.js"></script>
  <script src="js/components/results.js"></script>
  <script src="js/components/share.js"></script>
  <script src="js/components/archive.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
