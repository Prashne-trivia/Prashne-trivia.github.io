<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prashne Admin • Daily JSON Generator</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            saffron: { DEFAULT: '#FF6B00', hover: '#E65C00' },
            ink: { 950: '#0B0D13', 900: '#12151E', 800: '#1B202E', 700: '#272E40' },
            paper: { 50: '#FAF8F5', 100: '#F2EFE9', 200: '#E5E0D8' }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-ink-950 text-paper-50 p-4 sm:p-8 font-sans flex flex-col items-center justify-center">

  <div class="w-full max-w-2xl bg-ink-900 border-2 border-ink-700 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
    <div class="border-b border-ink-700 pb-4">
      <div class="flex items-center gap-2 text-saffron font-display font-bold text-xs uppercase tracking-wider mb-1">
        <span>🛠️ Prashne Admin Tool</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-display font-bold">Daily Trivia Builder</h1>
      <p class="text-xs sm:text-sm text-gray-400 mt-1">Fill in the details for today's drop, generate the JSON file, and drop it into your <code class="text-saffron bg-ink-800 px-1.5 py-0.5 rounded">data/</code> folder.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Date (YYYY-MM-DD)</label>
        <input type="date" id="input-date" class="w-full p-3 rounded-xl bg-ink-800 border border-ink-700 text-sm text-white focus:border-saffron outline-none" />
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Issue Number</label>
        <input type="number" id="input-issue" value="1" class="w-full p-3 rounded-xl bg-ink-800 border border-ink-700 text-sm text-white focus:border-saffron outline-none" />
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Short Theme Title</label>
        <input type="text" id="input-title" placeholder="Issue #1: Startups & Cinema" class="w-full p-3 rounded-xl bg-ink-800 border border-ink-700 text-sm text-white focus:border-saffron outline-none" />
      </div>
    </div>

    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-display font-bold text-base text-saffron">7 Questions</h3>
        <span class="text-xs text-gray-400">All 4 options required</span>
      </div>
      <div id="questions-builder" class="space-y-4 max-h-[420px] overflow-y-auto pr-2"></div>
    </div>

    <div class="pt-2">
      <button onclick="generateJSONFile()" class="w-full py-4 rounded-2xl bg-saffron hover:bg-saffron-hover font-display font-bold text-white text-base shadow-lg cursor-pointer transition-colors">
        Download Daily JSON File 📥
      </button>
    </div>
  </div>

  <script>
    // Set default date to today
    document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
    
    const container = document.getElementById('questions-builder');

    // Build form fields for 7 questions
    for (let i = 1; i <= 7; i++) {
      const div = document.createElement('div');
      div.className = 'p-4 rounded-2xl bg-ink-800/80 border border-ink-700 space-y-3';
      div.innerHTML = `
        <div class="font-display font-bold text-xs text-saffron">Question ${i} of 7</div>
        <input type="text" placeholder="Enter question statement..." class="q-text w-full p-3 rounded-xl bg-ink-950 border border-ink-700 text-xs sm:text-sm text-white focus:border-saffron outline-none" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input type="text" placeholder="Option A" class="q-opt-0 w-full p-2.5 rounded-xl bg-ink-950 border border-ink-700 text-xs text-white outline-none" />
          <input type="text" placeholder="Option B" class="q-opt-1 w-full p-2.5 rounded-xl bg-ink-950 border border-ink-700 text-xs text-white outline-none" />
          <input type="text" placeholder="Option C" class="q-opt-2 w-full p-2.5 rounded-xl bg-ink-950 border border-ink-700 text-xs text-white outline-none" />
          <input type="text" placeholder="Option D" class="q-opt-3 w-full p-2.5 rounded-xl bg-ink-950 border border-ink-700 text-xs text-white outline-none" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <select class="q-correct p-2.5 rounded-xl bg-ink-950 border border-ink-700 text-xs text-saffron font-bold outline-none">
            <option value="0">Correct: Option A</option>
            <option value="1">Correct: Option B</option>
            <option value="2">Correct: Option C</option>
            <option value="3">Correct: Option D</option>
          </select>
          <input type="text" placeholder="Fun fact / explanation..." class="q-fact sm:col-span-2 p-2.5 rounded-xl bg-ink-950 border border-ink-700 text-xs text-white outline-none" />
        </div>
      `;
      container.appendChild(div);
    }

    function generateJSONFile() {
      const dateStr = document.getElementById('input-date').value;
      const issueNumber = Number(document.getElementById('input-issue').value);
      const title = document.getElementById('input-title').value || `Issue #${issueNumber}`;

      if (!dateStr) {
        alert("Please select a date.");
        return;
      }

      const questions = [];
      const blocks = container.children;

      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        const qText = b.querySelector('.q-text').value.trim();
        const opts = [
          b.querySelector('.q-opt-0').value.trim(),
          b.querySelector('.q-opt-1').value.trim(),
          b.querySelector('.q-opt-2').value.trim(),
          b.querySelector('.q-opt-3').value.trim()
        ];
        const correctIndex = Number(b.querySelector('.q-correct').value);
        const fact = b.querySelector('.q-fact').value.trim();

        if (!qText || opts.some(o => !o)) {
          alert(`Please complete Question ${i + 1} and all its options before downloading.`);
          return;
        }

        questions.push({
          question: qText,
          options: opts,
          correctIndex: correctIndex,
          fact: fact || "Great question!"
        });
      }

      const payload = {
        issueNumber: issueNumber,
        title: title,
        questions: questions
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      alert(`Success! File downloaded as '${dateStr}.json'.\n\nNext steps:\n1. Move this file into your project's 'data/' folder.\n2. Add an entry for "${dateStr}" in your 'data/config.json' file.`);
    }
  </script>
</body>
</html>
