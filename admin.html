<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Prashne admin</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
    button, input { font: inherit; padding: .5rem .8rem; margin: .2rem .2rem .2rem 0; }
    .q { border: 1px solid #ddd; border-radius: 8px; padding: .6rem; margin: .5rem 0; font-size: .9rem; }
    #log { font-weight: 600; min-height: 1.4em; }
    section { margin: 1.2rem 0; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
  <h1>Prashne admin</h1>
  <p id="status">Loading…</p>
  <section>
    <h2>1. Log in (admin account)</h2>
    <button id="google">Continue with Google</button>
    <input id="email" type="email" placeholder="you@example.com" /><button id="email-btn">Email me a link</button>
    <button id="logout">Log out</button>
  </section>
  <section>
    <h2>2. Choose a day file</h2>
    <input id="file" type="file" accept=".js,.json" />
    <p style="font-size:.85rem">Format: <code>window.PRASHNE_DAYS['2026-11-25'] = { issueNumber: 6, title: "…", questions: [ …7… ] }</code></p>
    <div id="preview"></div>
  </section>
  <section>
    <h2>3. Publish</h2>
    <button id="publish" disabled>Publish to database</button>
    <p id="log"></p>
    <p style="font-size:.85rem">Re-uploading a date replaces it, unless someone has already played it.</p>
  </section>
  <script src="js/core/config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
